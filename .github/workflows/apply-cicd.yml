name: Terraform Apply CICD

on:
  push:
    branches:
      - main

env:
  TF_VERSION: 1.15.5
  AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION }}
  AWS_ROLE_ARN: ${{ vars.IAM_GITHUB_ACTIONS_DEPLOY_ROLE_ARN }}

permissions:
  id-token: write
  contents: read
  actions: read
  pull-requests: write

jobs:
  terraform-apply:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      # Checkout the repository code
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v4

      # Assume Role with OIDC
      - name: Assume Role with OIDC
        id: assume-role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      # Set up Terraform
      - name: Set up Terraform
        id: setup-terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # Terraform format check
      - name: Exec Terraform Format Check
        id: fmt
        run: terraform fmt -recursive -check

        # Because of occured error with "exit code 3", we ignore the error and continue to next step.
        continue-on-error: true

      - name: Exec Terraform init
        id: init
        run: terraform init

      - name: terraform apply
        id: apply
        run: terraform apply -auto-approve
