name: Terraform Plan CICD

on:
  push:
    branches:
      - main

env:
  TF_VERSION: 1.15.7
  AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION }}
  AWS_ROLE_ARN: ${{ vars.IAM_GITHUB_ACTIONS_DEPLOY_ROLE_ARN }}

permissions:
  id-token: write
  contents: read
  actions: read
  pull-requests: write

jobs:
  terraform-plan-and-comment:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Assume Role with OIDC
      - name: Assume Role with OIDC
        id: assume-role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      # Set up Terraform
      - name: Set up Terraform
        id: setup-terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # Terraform format check
      - name: Exec Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive

        # Because of occured error with "exit code 3", we ignore the error and continue to next step.
        continue-on-error: true

      # terraform init
      - name: Terraform Init
        id: init
        run: terraform init

      # terraform validate
      - name: Terraform Validate
        id: validate
        run: terraform validate

      # terraform plan
      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color

      # Generate GitHub Issues to output of terraform plan result
      - name: Generate GitHub Issues for terraform plan result
        id: generate-issues
        uses: actions/github-script@v6
        env:
          # stdout of terraform plan command is set to PLAN_OUTPUT environment variable.
          PLAN: "terraform plan result\n${{ steps.plan.outputs.stdout }}"

        with:
          script: |

            const output = `### terraform cicd
            #### Terraform Format and Style \`${{ steps.fmt.outcome }}\`
            #### Terraform Initialization \`${{ steps.init.outcome }}\`
            #### Terraform Plan \`${{ steps.plan.outcome }}\`
            #### Terraform Validation \`${{ steps.validate.outcome }}\`

            <details><summary>Show Plan</summary>

            \`\`\`${process.env.PLAN}\`\`\`

            </details>`;

            github.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })
