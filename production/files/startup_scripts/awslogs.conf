[general]
state_file = /var/lib/awslogs/agent-state

[/var/log/cron]
datetime_format = '%Y-%m-%d %H:%M:%S'
log_group_name = ${log_group_name}
buffer_duration = 5000
time_zone = UTC
initial_position = start_of_file
file = /var/log/cron
log_stream_name = {instance_id}_/var/log/cron

